<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <main class="main">
      <div
        class="card"
        role="region"
        aria-label="NFT preview: Equilibrium #3429"
      >
        <div class="card__container">
          <img
            src="./images/image-equilibrium.jpg"
            alt="Abstract geometric cube artwork for Equilibrium #3429"
            class="card__image"
          />

          <div class="card__overlay"></div>

          <img
            src="./images/icon-view.svg"
            alt="View icon"
            class="card__view"
          />
        </div>

        <div class="card__content">
          <h1 class="card__title">
            <a href="#">Equilibrium #3429</a>
          </h1>

          <p class="card__description">
            Our Equilibrium collection promotes balance and calm.
          </p>

          <div class="card__meta">
            <p class="card__price">
              <img src="./images/icon-ethereum.svg" alt="" aria-hidden="true" />

              <span>0.041 ETH</span>
            </p>

            <p class="card__time">
              <img src="./images/icon-clock.svg" alt="" aria-hidden="true" />

              <span>3 days left</span>
            </p>
          </div>

          <hr class="card__divider" />

          <div class="card__author">
            <img
              src="./images/image-avatar.png"
              alt="Jules Wyvern profile picture"
              class="card__author-avatar"
            />

            <p class="card__author-name">
              <span class="card__author-title">Creation of</span>

              <a href="#">Jules Wyvern</a>
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
